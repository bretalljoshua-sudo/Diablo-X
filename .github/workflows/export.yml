# Windows-Build als Download (Artifact). Läuft nur bei Pushes auf main und manuell
# (Actions → „Windows-Export“ → „Run workflow“), um Actions-Minuten zu sparen.
# Bei einem Versions-Tag (v0.1.0, …) legt der Lauf zusätzlich ein GitHub-Release mit der ZIP an.
name: Windows-Export

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Windows-Build exportieren
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: LFS-Dateiliste
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - name: Godot-Version lesen
        id: godot
        run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/godot
          key: godot-${{ steps.godot.outputs.version }}-linux
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-${{ steps.godot.outputs.version }}-templates-windows
      - run: tools/install_godot.sh --templates

      - name: Export
        run: tools/export_windows.sh

      - name: Kurzname des Commits
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: SpielJBR-windows-${{ steps.meta.outputs.sha }}
          path: build/windows/
          retention-days: 30
          if-no-files-found: error

      - name: Release zum Versions-Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip_name="SpielJBR-${TAG}-windows.zip"
          (cd build/windows && zip -r "../../${zip_name}" .)
          notes="Windows-Build ${TAG}. ZIP entpacken und SpielJBR.exe starten. Details im README."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$zip_name" --clobber
          else
            gh release create "$TAG" "$zip_name" --title "Spiel JBR ${TAG}" --notes "$notes"
          fi
